name: dholera_real_estate
description: "Dholera Real Estate — Property Listing and Management Mobile Application"
publish_to: 'none'
version: 1.0.4+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.0.7
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
